<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="都市异常事务委员会中央档案系统 · 星昱一至三级关联档案">
<title>CAT1 星昱 · MAAC 中央档案系统</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#090f19; --rail:#0c1420; --panel:#101a29; --deep:#0b131f;
    --line:#253449; --ink:#e8eff9; --body:#b8c7da; --muted:#91a5bf;
    --blue:#8bc7ff; --blue-strong:#63aeff; --red:#ff9caa; --green:#91d9bd;
    --mono:Consolas,"SFMono-Regular",Menlo,monospace;
    --sans:"Microsoft YaHei UI","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
  }
  *, *::before, *::after { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.75 var(--sans); }
  a { color:inherit; text-decoration:none; }
  a, summary { -webkit-tap-highlight-color:transparent; }
  :focus-visible { outline:2px solid var(--blue); outline-offset:4px; }
  h1,h2,h3,p,dl,dd,ol,ul { margin:0; }
  svg { display:block; }
  .icon { width:18px; height:18px; flex:none; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .symbols { position:absolute; width:0; height:0; overflow:hidden; }
  .mono { font-family:var(--mono); }
  .skip { position:fixed; top:10px; left:12px; z-index:5; transform:translateY(-150%); padding:10px 16px; background:var(--blue); color:var(--bg); }
  .skip:focus { transform:none; }
  .mast { background:#0b131f; border-bottom:1px solid var(--line); }
  .mast-inner { max-width:1600px; min-height:73px; margin:auto; padding:10px 29px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .brand, .mast-status, .classified, .rail-title, .sealed-label, .history-heading { display:flex; align-items:center; gap:11px; }
  .brand-mark { width:40px; height:42px; color:var(--blue); flex:none; }
  .brand-text { display:grid; gap:3px; }
  .brand-text strong { font:700 23px/1 var(--mono); letter-spacing:.16em; }
  .brand-text span { color:var(--muted); font-size:11px; letter-spacing:.08em; line-height:1.35; }
  .mast-status { gap:22px; }
  .session { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:12px; white-space:nowrap; }
  .dot { width:7px; height:7px; border-radius:50%; background:currentColor; flex:none; box-shadow:0 0 10px currentColor; }
  .session .dot, .service .dot { color:var(--green); }
  .classified { gap:7px; padding:5px 10px; border:1px solid #744353; color:var(--red); background:#251720; font-size:12px; white-space:nowrap; }
  .classified .icon { width:14px; height:14px; }
  .layout { max-width:1600px; margin:auto; display:grid; grid-template-columns:220px minmax(0,1fr) 254px; align-items:start; }
  .sidebar { position:sticky; top:0; padding:29px 16px 24px 23px; min-width:0; }
  .nav-label, .rail-kicker { font:11px/1.4 var(--mono); color:var(--muted); letter-spacing:.14em; }
  .nav-label { padding:0 9px 14px; }
  .nav-list { list-style:none; padding:0; display:grid; gap:4px; }
  .nav-list a { display:flex; align-items:center; gap:10px; min-height:43px; padding:8px 10px; border:1px solid transparent; border-left:2px solid transparent; border-radius:0 4px 4px 0; color:var(--body); }
  .nav-list a:hover { color:var(--ink); background:#172338; }
  .nav-list a[aria-current] { color:var(--blue); background:#14243a; border-color:#264061; border-left-color:var(--blue-strong); }
  .nav-list .index { margin-left:auto; color:var(--muted); font:11px var(--mono); }
  .nav-list .icon { width:16px; height:16px; }
  .nav-rule { height:1px; background:var(--line); margin:16px 0 12px; }
  .nav-list .locked { color:var(--red); }
  .archive-list { margin-bottom:17px; padding-bottom:14px; border-bottom:1px solid var(--line); }
  .archive-list .level { flex:none; min-width:24px; padding:1px 3px; text-align:center; border:1px solid #375370; border-radius:3px; color:var(--blue); font:12px/1.5 var(--mono); }
  .sidebar-note { margin:27px 10px 0; padding-top:12px; border-top:1px solid var(--line); color:var(--muted); font-size:11px; letter-spacing:.04em; }
  .main { min-width:0; padding:23px 25px 0; border-inline:1px solid #1b293b; }
  .crumbs { display:flex; align-items:center; flex-wrap:wrap; gap:7px 9px; margin-bottom:14px; color:var(--muted); font-size:12px; }
  .crumbs strong { color:var(--body); font-weight:500; }
  .crumbs .icon { width:13px; height:13px; }
  section { scroll-margin-top:20px; }
  .hero { position:relative; isolation:isolate; overflow:hidden; border:1px solid #355270; border-top:2px solid var(--blue-strong); background:radial-gradient(ellipse at 85% 35%, #1a3554 0%, #122135 43%, #101b2b 75%); border-radius:6px; }
  .hero::before { content:""; position:absolute; inset:0; z-index:-1; background-image:linear-gradient(#85b9f41a 1px,transparent 1px),linear-gradient(90deg,#85b9f41a 1px,transparent 1px); background-size:28px 28px; mask-image:linear-gradient(90deg,transparent 20%,#000b 75%); }
  .hero-inner { display:grid; grid-template-columns:minmax(0,1fr) minmax(140px,34%); align-items:center; gap:10px; padding:29px 31px 24px; }
  .hero-kicker { display:flex; gap:10px; align-items:center; color:var(--blue); letter-spacing:.13em; font-size:11px; }
  .hero-kicker::before { content:""; width:18px; height:2px; background:var(--blue-strong); flex:none; }
  .hero h1 { margin:7px 0 4px; font-size:clamp(52px,6.3vw,92px); line-height:1.1; font-weight:760; letter-spacing:.09em; }
  .hero-role { color:#d3e4f8; font-size:clamp(14px,1.6vw,18px); font-weight:650; letter-spacing:.05em; }
  .hero-role .mono { color:var(--blue); }
  .hero-intro { color:var(--body); max-width:40ch; margin-top:15px; line-height:1.8; }
  .mark { width:100%; max-width:252px; justify-self:end; height:auto; }
  .hero-meta { display:grid; grid-template-columns:.85fr 1.25fr 1.25fr; border-top:1px solid #324760; background:#0d1828b5; }
  .hero-meta > div { min-width:0; padding:13px 16px 13px 23px; }
  .hero-meta > div + div { border-left:1px solid #324760; }
  dt { color:var(--muted); font-size:12px; }
  .hero-meta dd { color:var(--ink); margin-top:2px; font-size:14px; font-weight:650; }
  .service { display:inline-flex; align-items:center; gap:8px; }
  .right { position:sticky; top:0; min-width:0; padding:28px 22px 24px 17px; }
  .rail-kicker { margin-bottom:13px; }
  .rail-card { border:1px solid var(--line); background:var(--rail); border-radius:5px; margin-bottom:13px; }
  .rail-title { gap:8px; padding:11px 13px; border-bottom:1px solid var(--line); font-size:13px; }
  .rail-title .icon { color:var(--blue); width:16px; height:16px; }
  .rail-data { padding:5px 13px; }
  .rail-data > div { padding:9px 0; }
  .rail-data > div + div { border-top:1px solid #202e40; }
  .rail-data dd { font-size:12px; overflow-wrap:anywhere; }
  .access { padding:13px; }
  .access p { color:var(--body); font-size:12px; margin-top:6px; }
  .seal-link { display:block; background:#21151f; border-color:#673b4a; padding:12px 13px; }
  .seal-link:hover { background:#301b28; border-color:var(--red); }
  .sealed-label { color:var(--red); font-weight:650; font-size:13px; gap:7px; }
  .sealed-label .icon { width:16px; height:16px; }
  .seal-link small { display:block; color:#d0aeb8; margin:5px 0 0 23px; }
  .seal-link .arrow { margin-left:auto; }
  .record-section { margin-top:28px; }
  .section-heading { display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .section-number { color:var(--blue); font:12px var(--mono); border:1px solid #345174; background:#13243a; border-radius:3px; padding:5px 7px; }
  .section-heading h2 { font-size:21px; line-height:1.35; letter-spacing:.055em; }
  .section-heading .label { margin-left:auto; }
  .label { color:var(--blue); font-size:11px; border:1px solid #35516e; padding:2px 7px; border-radius:3px; white-space:nowrap; font-weight:500; }
  .label.observation { color:#bfd4e9; border-color:#44576f; }
  .label.assessment { color:#f1cc93; border-color:#695638; }
  .panel { border:1px solid var(--line); border-radius:5px; background:var(--panel); }
  .identity-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); }
  .identity-grid > div { padding:12px 17px; border-bottom:1px solid var(--line); }
  .identity-grid > div:nth-child(3n+2), .identity-grid > div:nth-child(3n+3) { border-left:1px solid var(--line); }
  .identity-grid dd { font-weight:600; margin-top:2px; }
  .panel-note { padding:12px 17px; color:var(--body); font-size:13px; }
  .duty-list { list-style:none; padding:0; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); }
  .duty-list li { display:flex; align-items:flex-start; gap:11px; padding:15px 16px; border-bottom:1px solid var(--line); }
  .duty-list li:nth-child(even) { border-left:1px solid var(--line); }
  .duty-list .mono { color:var(--blue); font-size:11px; margin-top:3px; }
  .duty-list h3 { font-size:14px; margin-bottom:3px; }
  .duty-list p, .assessment-row p, .relation-body p { color:var(--body); font-size:13px; }
  .panel-note strong { color:var(--ink); margin-right:.45em; }
  .relationship-intro { color:var(--body); margin-bottom:12px; font-size:13px; }
  details > summary { cursor:pointer; list-style:none; }
  details > summary::-webkit-details-marker { display:none; }
  .relation + .relation { margin-top:8px; }
  .relation summary { display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:12px; padding:12px 15px; }
  .relation summary:hover, .check summary:hover { background:#ffffff0a; }
  .relation-id { padding:5px 8px; font:700 13px var(--mono); color:var(--blue); background:#172b43; border:1px solid #2f4b69; border-radius:3px; }
  .relation-name { font-weight:700; font-size:16px; margin-right:7px; }
  .relation-role { color:var(--muted); font-size:12px; }
  .relation-sub { display:block; color:var(--body); font-size:12px; }
  .chevron { color:var(--blue); transition:transform .16s ease; }
  details[open] > summary .chevron { transform:rotate(180deg); }
  .relation-body { display:grid; grid-template-columns:1fr 1fr; gap:13px 20px; padding:14px 16px; border-top:1px solid var(--line); }
  .relation-body h3 { font-size:13px; margin-bottom:3px; }
  .relation-body .judgment { grid-column:1/-1; padding-top:11px; border-top:1px solid var(--line); }
  .judgment .label { margin-right:.55em; }
  .assessment-row { display:grid; grid-template-columns:minmax(114px,23%) 1fr; align-items:start; gap:12px; padding:15px 17px; }
  .assessment-row + .assessment-row { border-top:1px solid var(--line); }
  .assessment-row h3 { font-size:14px; }
  .assessment-row h3 .label { display:table; margin-top:5px; }
  .assessment-row p + p { margin-top:6px; }
  .history .section-number { color:var(--red); border-color:#794253; background:#291822; }
  .history-box { border:1px solid #7a4354; border-top:2px solid #ce7186; border-radius:5px; background:repeating-linear-gradient(135deg,#bc718406 0 1px,transparent 1px 12px),#1c141e; }
  .history-top { padding:18px 20px; }
  .history-heading { color:var(--red); gap:9px; font-size:17px; }
  .history-heading .icon { width:20px; height:20px; }
  .history-id { margin-top:4px; color:#d8b4c1; font-size:12px; overflow-wrap:anywhere; }
  .history-top p:last-child { color:#e2c9d3; font-size:13px; margin-top:9px; }
  .check { border-top:1px solid #5e3545; }
  .check summary { color:var(--red); display:flex; align-items:center; justify-content:space-between; padding:12px 20px; font-weight:650; }
  .check summary .chevron { color:inherit; }
  .check-result { border-top:1px solid #5e3545; padding:14px 20px; }
  .check-result dl { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
  .check-result dt { color:#d8b4c1; }
  .denied { color:var(--red); font-weight:700; }
  .check-result p { margin-top:9px; color:#e2c9d3; font-size:12px; }
  .level-record { padding-bottom:2px; }
  .level-record + .level-record { margin-top:28px; }
  .level-banner { border-top:2px solid var(--blue-strong); padding:20px; background:linear-gradient(120deg,#162841,var(--panel) 72%); }
  .level-banner h2 { margin:4px 0 5px; font-size:clamp(22px,3.3vw,35px); line-height:1.25; letter-spacing:.04em; }
  .level-fields { margin-top:13px; }
  .level-record .panel-note + .panel-note { border-top:1px solid var(--line); }
  .level-record .panel-note p { margin-top:4px; }
  .record-fields { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:1px; overflow:hidden; }
  .record-fields > div { padding:10px 13px; outline:1px solid var(--line); }
  .record-fields dd { margin-top:2px; overflow-wrap:anywhere; }
  .record-fields .wide { grid-column:span 2; }
  .record-body .panel-note h3 { color:var(--ink); font-size:14px; }
  .record-body .panel-note p { margin-top:7px; }
  .record-body blockquote { margin:8px 0 2px; padding-left:12px; border-left:2px solid #47698f; }
  .record-body .record-fields { margin-top:8px; }
  .record-end { padding:14px 17px; }
  .record-end h3 { color:var(--blue); font-size:14px; }
  .record-end dl { display:flex; flex-wrap:wrap; gap:6px 22px; margin-top:7px; }
  .record-end dl > div { display:flex; align-items:baseline; gap:6px; }
  .record-end dd { font-size:13px; }
  .record-end p { margin-top:9px; color:var(--body); font-size:13px; }
  .acb-log { color:var(--blue); font-size:12px; background:var(--deep); }
  .acb-log a, .acb-index a { color:var(--blue); text-decoration:underline; text-underline-offset:3px; }
  .acb-body h4 { margin:13px 0 0; color:var(--blue); font-size:13px; }
  .acb-body h5 { margin:9px 0 0; color:var(--ink); font-size:13px; }
  .acb-body ol, .acb-body ul { margin-top:7px; padding-left:21px; }
  .acb-index { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:9px; }
  .acb-index article { background:var(--deep); padding:10px 11px; min-width:0; }
  .acb-index h4 { margin:0; overflow-wrap:anywhere; }
  .acb-index dl { margin-top:6px; }
  .acb-index dd { color:var(--ink); }
  .acb-denial { background:#21151f; }
  .acb-denial .record-fields > div { outline-color:#673b4a; }
  .acb-denial .mono { color:var(--red); }
  .layout[data-level="academy"], .layout[data-level="control"] { grid-template-columns:220px minmax(0,1fr); max-width:1160px; }
  .layout[data-level="academy"] .main, .layout[data-level="control"] .main { border-right:0; }
  .foot { grid-column:2; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:6px 10px; margin:29px 26px 0; padding:15px 0 23px; border-top:1px solid var(--line); font-size:11px; color:var(--muted); }
  .foot a:hover { color:var(--blue); }
  @media (max-width:1160px) {
    .layout { grid-template-columns:173px minmax(0,1fr) 216px; }
    .layout[data-level="academy"], .layout[data-level="control"] { grid-template-columns:173px minmax(0,1fr); }
    .sidebar { padding-left:12px; padding-right:10px; }
    .right { padding-right:12px; padding-left:12px; }
    .main { padding-inline:17px; }
    .foot { margin-inline:18px; }
    .hero-inner { padding:23px; }
    .hero-meta > div { padding-inline:12px; }
  }
  @media (max-width:990px) {
    .layout { grid-template-columns:169px minmax(0,1fr); }
    .main { border-right:0; }
    .right { position:static; grid-column:2; padding:24px 17px 0; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); align-items:start; gap:10px; }
    .right .rail-kicker, .right .seal-link { grid-column:1/-1; }
    .right .rail-card, .right .rail-kicker { margin:0; }
  }
  @media (max-width:680px) {
    .mast-inner { min-height:62px; padding:8px 12px; gap:8px; }
    .brand { gap:7px; }
    .brand-mark { width:30px; height:34px; }
    .brand-text strong { font-size:20px; }
    .brand-text span { font-size:10px; }
    .session { display:none; }
    .classified { padding:4px 6px; gap:4px; font-size:11px; }
    .classified .icon { display:none; }
    .layout { display:block; }
    .sidebar { position:static; padding:11px 12px; border-bottom:1px solid var(--line); background:var(--rail); }
    .nav-label, .sidebar-note, .nav-rule, .nav-list .index { display:none; }
    .nav-list { grid-template-columns:repeat(3,minmax(0,1fr)); gap:5px; }
    .nav-list a { border:1px solid var(--line); border-radius:4px; gap:6px; justify-content:center; min-height:36px; font-size:12px; padding:3px; }
    .nav-list .icon { width:13px; height:13px; }
    .archive-list { margin-bottom:8px; padding-bottom:8px; }
    .archive-list a { gap:4px; }
    .archive-list .level { min-width:18px; font-size:11px; }
    .main { padding:13px 12px 0; border:0; }
    .crumbs { margin-bottom:10px; }
    .hero-inner { grid-template-columns:minmax(0,1fr) minmax(75px,28%); gap:4px; padding:17px 13px 16px; }
    .hero h1 { font-size:clamp(45px,10vw,65px); }
    .hero-intro { margin-top:9px; font-size:12px; }
    .hero-kicker { letter-spacing:.08em; }
    .hero-kicker::before { width:11px; }
    .hero-role { font-size:13px; letter-spacing:0; }
    .hero-meta { grid-template-columns:.8fr 1fr 1.45fr; }
    .hero-meta > div { padding:8px 7px; }
    .hero-meta dd { font-size:12px; }
    .record-section { margin-top:22px; }
    .section-heading h2 { font-size:18px; }
    .identity-grid > div { padding:9px; }
    .identity-grid dd { font-size:13px; }
    .duty-list li { padding:11px; gap:7px; }
    .assessment-row { grid-template-columns:1fr; gap:7px; }
    .assessment-row h3 .label { display:inline; margin:0 0 0 5px; }
    .record-fields { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .acb-index { grid-template-columns:1fr; }
    .right { padding-inline:12px; }
    .foot { margin-inline:12px; }
  }
  @media (max-width:410px) {
    .duty-list, .relation-body { grid-template-columns:1fr; }
    .duty-list li:nth-child(even) { border-left:0; }
    .hero-role { font-size:12px; }
    .right { grid-template-columns:1fr; }
  }
  @media (prefers-reduced-motion:reduce) {
    html { scroll-behavior:auto; }
    .chevron { transition:none; }
  }
  button { font:inherit; }
  .lock-button { padding:5px 10px; border:1px solid var(--line); border-radius:3px; color:var(--body); background:var(--panel); cursor:pointer; white-space:nowrap; }
  .lock-button:hover { border-color:var(--blue); color:var(--ink); }
  .gate { max-width:1080px; margin:0 auto; padding:clamp(24px,7vw,93px) 24px; }
  .gate-frame { display:grid; grid-template-columns:.92fr 1.08fr; background:var(--panel); border:1px solid #355270; border-top:2px solid var(--blue-strong); border-radius:7px; overflow:hidden; }
  .gate-intro { position:relative; display:flex; flex-direction:column; align-items:flex-start; min-width:0; padding:clamp(23px,4vw,42px); background:radial-gradient(ellipse at 49% 78%,#1a3857,transparent 71%),#0d192a; }
  .gate-intro h1 { font-size:clamp(27px,4vw,44px); line-height:1.2; margin:9px 0; letter-spacing:.05em; }
  .gate-intro p + h1 + p { color:var(--body); }
  .gate-graphic { margin:auto; padding-top:17px; color:var(--muted); text-align:center; letter-spacing:.1em; font-size:10px; }
  .gate-graphic svg { width:clamp(110px,16vw,190px); margin:auto; }
  .gate-form { padding:clamp(20px,4vw,37px); border-left:1px solid var(--line); min-width:0; }
  .gate-form h2 { margin-bottom:9px; font-size:21px; letter-spacing:.06em; }
  .gate-form fieldset { min-inline-size:0; padding:0; margin:0; border:0; }
  .gate-form legend, .gate-field { color:var(--body); font-size:12px; font-weight:650; }
  .tier-options { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; margin:5px 0 14px; }
  .tier-options label { position:relative; min-width:0; }
  .tier-options input { position:absolute; width:1px; height:1px; opacity:0; }
  .tier-option { display:grid; gap:2px; height:100%; padding:7px 6px; border:1px solid var(--line); border-radius:4px; background:var(--deep); text-align:center; font-size:11px; line-height:1.45; cursor:pointer; }
  .tier-option b { color:var(--blue); font-size:17px; }
  .tier-options input:checked + .tier-option { background:#172e48; border-color:var(--blue-strong); }
  .tier-options input:focus-visible + .tier-option { outline:2px solid var(--blue); outline-offset:2px; }
  .gate-field { display:block; margin-top:9px; }
  .gate-session { display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 9px; margin:9px 0 12px; padding:7px 9px; border:1px solid var(--line); border-radius:4px; color:var(--body); font-size:12px; }
  .gate-session strong { color:var(--green); }
  .gate-form input[type=text], .gate-form input[type=password] { display:block; width:100%; min-height:43px; margin-top:4px; padding:8px 10px; border:1px solid #3b5069; border-radius:4px; color:var(--ink); background:var(--deep); font:16px var(--mono); }
  .gate-form input[aria-invalid=true] { border-color:var(--red); }
  .gate-submit { display:flex; align-items:center; justify-content:center; gap:8px; min-height:44px; width:100%; margin-top:17px; padding:7px 10px; border:1px solid var(--blue-strong); border-radius:4px; background:#223f60; color:var(--ink); font-weight:650; cursor:pointer; }
  .gate-submit:hover { background:#2d527b; }
  .gate-form fieldset:disabled { opacity:.63; }
  .gate-form fieldset:disabled .gate-submit, .gate-form fieldset:disabled .tier-option { cursor:wait; }
  .gate-error { color:var(--red); margin-top:9px; font-size:13px; }
  .gate-error:empty { margin:0; }
  .load-panel { margin-top:13px; }
  .load-caption { display:flex; justify-content:space-between; gap:10px; color:var(--blue); font-size:12px; }
  .load-panel progress { display:block; width:100%; height:6px; margin-top:7px; border:0; border-radius:4px; overflow:hidden; background:#21324a; accent-color:var(--blue-strong); }
  .load-panel progress::-webkit-progress-bar { background:#21324a; }
  .load-panel progress::-webkit-progress-value { background:var(--blue-strong); transition:width .19s ease; }
  .load-panel progress::-moz-progress-bar { background:var(--blue-strong); }
  .vault-enter { animation:vault-enter .24s ease both; }
  @keyframes vault-enter { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  @media (max-width:680px) {
    .gate { padding:17px 12px; }
    .gate-frame { grid-template-columns:1fr; }
    .gate-intro { padding:18px; }
    .gate-graphic { display:none; }
    .gate-form { border-left:0; border-top:1px solid var(--line); }
    .mast-status { gap:6px; }
    .mast-status:has(.lock-button:not([hidden])) .classified { display:none; }
    .lock-button { padding:5px 7px; font-size:11px; }
  }
  @media (prefers-reduced-motion:reduce) {
    .vault-enter { animation:none; }
    .load-panel progress::-webkit-progress-value { transition:none; }
  }

  .roster-wrap { max-width:100%; overflow:auto; margin:7px 0; border:1px solid var(--line); border-radius:4px; }
  .roster { width:100%; min-width:385px; border-collapse:collapse; text-align:left; font-size:13px; }
  .roster th, .roster td { padding:7px 8px; border-bottom:1px solid var(--line); }
  .roster th { color:var(--blue); }
  .roster thead th { background:var(--deep); }
  .roster tbody tr:last-child > * { border-bottom:0; }
  .history-index { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:5px 12px; padding:0 20px 12px; }
  .history-index dd { color:#e2c9d3; }
</style>

<script>
  const byId = id => document.getElementById(id);
  const gate = byId('gate');
  const form = byId('access-form');
  const fields = byId('access-fields');
  const account = byId('access-account');
  const accountField = byId('access-account-field');
  const sessionLabel = byId('access-session');
  const sessionName = byId('access-session-account');
  const gateDescription = byId('gate-description');
  const accessTitle = byId('access-title');
  const password = byId('access-password');
  const error = byId('access-error');
  const loadPanel = byId('load-panel');
  const layout = byId('archive-layout');
  const recordBody = byId('record-body');
  const sectionIndex = byId('section-index');
  const metadata = byId('record-metadata');
  const skipLink = document.querySelector('.skip');
  const lockButton = byId('lock-button');
  const mastLevel = byId('mast-level');
  const mastSession = byId('mast-session');
  const footerCode = byId('footer-code');
  const archiveLinks = [...document.querySelectorAll('[data-archive]')];
  const tiers = [...form.querySelectorAll('input[name="tier"]')];
  const encoder = new TextEncoder();
  const decoder = new TextDecoder();
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const vault = JSON.parse(byId('vault-data').textContent);
  const records = {
    academy: { start:'#academy', level:'Ⅰ · 学院公开' },
    control: { start:'#control', level:'Ⅱ · 控制局内部' },
    maac: { start:'#overview', level:'MAAC-Ⅲ 绝密' }
  };
  const maacSections = new Set(['#overview', '#identity', '#duties', '#relationships', '#assessment', '#history']);
  let selected = 'maac';
  let active = null;
  let sessionAccount = null;
  let attempt = 0;
  let busy = false;

  function archiveFor(hash) {
    if (hash === '#academy') return 'academy';
    if (hash === '#control') return 'control';
    if (maacSections.has(hash)) return 'maac';
    return null;
  }

  function decodeBase64(value) {
    return Uint8Array.from(atob(value), character => character.charCodeAt(0));
  }

  async function decryptArchive(key, username, secret) {
    const entry = vault.records[key];
    const subtle = globalThis.crypto.subtle;
    const material = await subtle.importKey(
      'raw', encoder.encode(JSON.stringify([username, secret])), 'PBKDF2', false, ['deriveKey']
    );
    const derived = await subtle.deriveKey(
      {name:'PBKDF2', hash:'SHA-256', iterations:vault.iterations, salt:decodeBase64(entry.salt)},
      material, {name:'AES-GCM', length:256}, false, ['decrypt']
    );
    const plaintext = await subtle.decrypt(
      {name:'AES-GCM', iv:decodeBase64(entry.iv), additionalData:encoder.encode(key)},
      derived, decodeBase64(entry.data)
    );
    return JSON.parse(decoder.decode(plaintext));
  }

  function setProgress(step, caption) {
    loadPanel.hidden = false;
    byId('load-progress').value = step;
    byId('load-step').textContent = '0' + step + ' / 03';
    byId('load-status').textContent = caption;
  }

  function setBusy(value) {
    busy = value;
    fields.disabled = value || !globalThis.crypto?.subtle;
  }

  function clearError() {
    error.textContent = '';
    password.removeAttribute('aria-invalid');
  }

  function enter(element) {
    element.classList.remove('vault-enter');
    void element.offsetWidth;
    element.classList.add('vault-enter');
  }

  function jumpToTop() {
    window.scrollTo({top:0, behavior:'instant'});
  }

  function showGate(key, focus = false, forgetAccount = false) {
    attempt += 1;
    selected = key;
    active = null;
    layout.hidden = true;
    recordBody.replaceChildren();
    sectionIndex.replaceChildren();
    metadata.replaceChildren();
    footerCode.textContent = '';
    skipLink.hidden = true;
    if (forgetAccount) {
      sessionAccount = null;
      account.value = '';
    }
    const signedIn = sessionAccount !== null;
    accountField.hidden = account.disabled = signedIn;
    sessionLabel.hidden = !signedIn;
    sessionName.textContent = sessionAccount || '';
    accessTitle.textContent = signedIn ? '档案密码核验' : '授权登录';
    gateDescription.textContent = signedIn
      ? '登录状态有效。输入所选档案的专属密码即可继续。'
      : '选择档案层级，输入阅览账号与该层专属密码。';
    lockButton.hidden = !signedIn;
    mastLevel.textContent = '待核验';
    mastSession.textContent = signedIn ? '已登录 · 待核验' : '档案访问控制';
    for (const tier of tiers) tier.checked = tier.value === key;
    password.value = '';
    clearError();
    loadPanel.hidden = true;
    setBusy(false);
    if (fields.disabled) error.textContent = '当前浏览器无法解密档案。请用支持 Web Crypto 的浏览器打开此文件。';
    gate.hidden = false;
    enter(gate);
    jumpToTop();
    if (focus && !fields.disabled) (signedIn || account.value ? password : account).focus({preventScroll:true});
  }

  function updateSection() {
    const hash = window.location.hash;
    const target = maacSections.has(hash) ? hash : '#overview';
    for (const link of sectionIndex.querySelectorAll('a')) {
      if (link.hash === target) link.setAttribute('aria-current', 'location');
      else link.removeAttribute('aria-current');
    }
  }

  function openArchive(key, payload) {
    const record = records[key];
    const hash = archiveFor(window.location.hash) === key ? window.location.hash : record.start;
    active = key;
    selected = key;
    if (window.location.hash !== hash) window.history.replaceState(null, '', hash);
    recordBody.innerHTML = payload.html;
    sectionIndex.innerHTML = payload.index || '';
    metadata.innerHTML = payload.metadata || '';
    sectionIndex.hidden = metadata.hidden = key !== 'maac';
    layout.dataset.level = key;
    for (const link of archiveLinks) {
      if (link.dataset.archive === key) link.setAttribute('aria-current', 'page');
      else link.removeAttribute('aria-current');
    }
    updateSection();
    mastLevel.textContent = record.level;
    mastSession.textContent = '授权阅览 · 只读';
    footerCode.textContent = payload.code + ' · END OF RECORD';
    skipLink.href = record.start;
    skipLink.hidden = lockButton.hidden = false;
    gate.hidden = true;
    loadPanel.hidden = true;
    setBusy(false);
    layout.hidden = false;
    enter(layout);
    const destination = byId(hash.slice(1));
    destination?.focus({preventScroll:true});
    if (hash === record.start) jumpToTop();
    else destination?.scrollIntoView({behavior:'instant'});
  }

  function handleRoute(focus) {
    const hash = window.location.hash;
    if (hash === '#login') {
      showGate(selected, focus, true);
      return;
    }
    const key = archiveFor(hash) || active || selected;
    if (active === key) updateSection();
    else showGate(key, focus);
  }

  function wait(ms) {
    return reducedMotion.matches ? Promise.resolve() : new Promise(resolve => setTimeout(resolve, ms));
  }

  form.addEventListener('change', event => {
    if (event.target.name !== 'tier') return;
    selected = event.target.value;
    window.history.replaceState(null, '', records[selected].start);
    password.value = '';
    clearError();
  });

  form.addEventListener('input', event => {
    if (event.target === account || event.target === password) clearError();
  });

  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (busy || fields.disabled) return;
    const signedIn = sessionAccount !== null;
    const username = sessionAccount ?? account.value.trim();
    if (!username) {
      error.textContent = '请输入阅览账号。';
      account.focus();
      return;
    }
    const key = selected;
    const version = ++attempt;
    const opening = decryptArchive(key, username, password.value);
    password.value = '';
    clearError();
    setBusy(true);
    setProgress(1, signedIn ? '正在核验档案密码…' : '正在核验账号与档案密码…');
    const [result] = await Promise.allSettled([opening, wait(300)]);
    if (version !== attempt) return;
    if (result.status === 'rejected') {
      loadPanel.hidden = true;
      setBusy(false);
      password.setAttribute('aria-invalid', 'true');
      error.textContent = signedIn
        ? '核验失败。请检查所选档案的密码。'
        : '核验失败。请检查阅览账号与所选档案的密码。';
      password.focus();
      return;
    }
    setProgress(2, '核验通过，正在载入档案…');
    await wait(240);
    if (version !== attempt) return;
    setProgress(3, '档案就绪');
    await wait(180);
    if (version === attempt) {
      sessionAccount = username;
      account.value = '';
      openArchive(key, result.value);
    }
  });

  lockButton.addEventListener('click', () => {
    if (window.location.hash === '#login') showGate(selected, true, true);
    else window.location.hash = '#login';
  });
  window.addEventListener('hashchange', () => handleRoute(true));
  window.addEventListener('pagehide', () => showGate(selected, false, true));
  handleRoute(false);
</script>
</body>
</html>

</style></head><body><a class="skip" href="#main" data-i="skip">跳至正文</a><div class="utility"><div class="wrap"><span data-i="utility">一所面向城市与未来的独立高等教育机构</span><button class="lang" id="lang" type="button" aria-label="Switch to English">EN / 中文</button></div></div><header class="wrap nav"><a class="brand" href="index.html"><span class="mark">W</span><span><b data-i="name">沃格塞都城市学院</b><small>WOGRESS CITY INSTITUTE</small></span></a><a class="back" href="index.html" data-i="back">← 返回学院首页</a></header><section class="hero"><div class="wrap"><div class="kicker">WOGRESS CITY INSTITUTE / ALUMNI</div><h1 data-i="title">荣誉校友</h1><p data-i="hero">记录与学院共同成长的校友，关注他们在各自领域的探索与贡献。</p></div></section><main class="wrap main" id="main"><div class="intro"><div><div class="section-label">01 / DISTINGUISHED ALUMNI</div><h2 data-i="heading">寻找校友故事</h2></div><p data-i="description">通过姓名、所属学院、专业或贡献领域查询已公布的荣誉校友记录。校友资料将在确认并获准公开后发布。</p></div><section class="search-panel" aria-labelledby="search-title"><h2 id="search-title" data-i="searchTitle">查询荣誉校友</h2><form id="search"><label for="query" data-i="label">输入查询内容</label><div class="search-row"><input id="query" type="search" maxlength="100" autocomplete="off" placeholder="姓名、学院、专业或领域"><button class="primary" type="submit" data-i="submit">查询</button></div><p class="hint" data-i="hint">留空查询可查看全部已公布记录。</p></form></section><section class="results" aria-labelledby="results-title"><h2 id="results-title" data-i="results">查询结果</h2><div id="results" aria-live="polite"></div></section></main><footer><div class="wrap footer"><span>© Wogress City Institute</span><a href="index.html" data-i="back">← 返回学院首页</a></div></footer><script>
// 仅收录已确认并获准公开的校友；每条记录可填写 name、school、major、field、description。
const alumni=[];
const translations={zh:{skip:'跳至正文',utility:'一所面向城市与未来的独立高等教育机构',name:'沃格塞都城市学院',back:'← 返回学院首页',title:'荣誉校友',hero:'记录与学院共同成长的校友，关注他们在各自领域的探索与贡献。',heading:'寻找校友故事',description:'通过姓名、所属学院、专业或贡献领域查询已公布的荣誉校友记录。校友资料将在确认并获准公开后发布。',searchTitle:'查询荣誉校友',label:'输入查询内容',submit:'查询',hint:'留空查询可查看全部已公布记录。',results:'查询结果',placeholder:'姓名、学院、专业或领域',empty:'暂无已公布的荣誉校友记录。',noMatch:'未找到与查询条件相符的已公布记录。',count:'条记录'},en:{skip:'Skip to content',utility:'An independent institution for the city and the future',name:'Wogress City Institute',back:'← Back to institute home',title:'Distinguished Alumni',hero:'Celebrating alumni and their contributions across fields of endeavour.',heading:'Find alumni stories',description:'Search published alumni records by name, school, major or field. Profiles will appear once confirmed and approved for publication.',searchTitle:'Search alumni',label:'Search term',submit:'Search',hint:'Leave the field blank to view all published records.',results:'Search results',placeholder:'Name, school, major or field',empty:'No distinguished alumni records have been published yet.',noMatch:'No published records match your search.',count:'records'}};
let lang='zh';const query=document.querySelector('#query'),results=document.querySelector('#results');
function search(){const t=translations[lang],q=query.value.trim().toLocaleLowerCase(),matches=alumni.filter(x=>[x.name,x.school,x.major,x.field].some(v=>String(v||'').toLocaleLowerCase().includes(q)));results.replaceChildren();if(!matches.length){const p=document.createElement('p');p.className='status';p.textContent=alumni.length?t.noMatch:t.empty;results.append(p);return}const count=document.createElement('p');count.className='hint';count.textContent=matches.length+' '+t.count;results.append(count);for(const x of matches){const card=document.createElement('article');card.className='card';const h=document.createElement('h3');h.textContent=x.name;const p=document.createElement('p');p.textContent=[x.school,x.major,x.field].filter(Boolean).join(' · ');const d=document.createElement('p');d.textContent=x.description||'';card.append(h,p,d);results.append(card)}}
function translate(){let t=translations[lang];document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.title=t.title+' | '+t.name;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t[e.dataset.i]);query.placeholder=t.placeholder;document.querySelector('#lang').textContent=lang==='zh'?'EN / 中文':'中文 / EN';document.querySelector('#lang').setAttribute('aria-label',lang==='zh'?'Switch to English':'切换至中文');search()}
document.querySelector('#search').addEventListener('submit',e=>{e.preventDefault();search()});document.querySelector('#lang').addEventListener('click',()=>{lang=lang==='zh'?'en':'zh';translate()});translate();
</script></body></html>
